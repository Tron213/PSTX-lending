<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1"
    />
    <title>
      Вход администратора — ПАСТУХ
    </title>
    <link
      rel="icon"
      href="/assets/mark.svg"
    />
    <link
      rel="stylesheet"
      href="/styles.css"
    />
    <link
      rel="stylesheet"
      href="/news.css"
    />
    <script
      src="/admin-login.js"
      defer
    ></script>
  </head>
  <body>
    <header class="header">
      <a
        class="brand"
        href="/"
      >
        <img
          src="/assets/mark.svg"
          width="34"
          height="34"
          alt=""
        />
        ПАСТУХ
      </a>
      <a href="/news">К новостям ↗</a>
    </header>
    <main class="login-card">
      <p class="eyebrow">
        ПАСТУХ / ВХОД АДМИНИСТРАТОРА
      </p>
      <h1>С возвращением.</h1>
      <p>
        Войдите, чтобы публиковать новости
        и управлять материалами проекта.
      </p>
      <form id="login-form">
        <label for="username">
          Логин
        </label>
        <input
          id="username"
          name="username"
          autocomplete="username"
          maxlength="64"
          required
          autofocus
          autocapitalize="none"
          spellcheck="false"
        />
        <label for="password">
          Пароль
        </label>
        <div class="password-field">
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            maxlength="256"
            required
          />
          <button
            type="button"
            class="secondary"
            id="show-password"
            aria-label="Показать пароль"
            aria-pressed="false"
          >
            Показать
          </button>
        </div>
        <p
          id="login-message"
          role="status"
          aria-live="polite"
        ></p>
        <button
          class="button"
          type="submit"
          id="login-button"
        >
          Войти в админ-панель ↗
        </button>
      </form>
      <p class="hint">
        Сеанс действует 8 часов. Логин и
        пароль можно изменить в настройках
        админ-панели.
      </p>
    </main>
  </body>
</html>
